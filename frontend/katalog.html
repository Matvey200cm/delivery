<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Delivery Food — Тануки</title>
    <link rel="stylesheet" href="katalog.css">
    <link rel="stylesheet" href="cart.css">
    <link rel="stylesheet" href="auth.css">
    <script src="api.js" defer></script>
    <script src="auth.js" defer></script>
    <script src="cart.js" defer></script>
    <script src="katalog.js" defer></script>
</head>
<body>
    <header class="header">
        <div class="container header-block">
            <a href="home.html" class="logo">
                <img src="Картинки/logo.svg" alt="Логотип сервиса Delivery Food">
            </a>
            <input type="text" class="search-input" placeholder="Адрес доставки">
            <div class="buttons">
                <button class="btn btn-primary auth-open" type="button">Войти</button>
                <button class="btn btn-outline" type="button" id="cart-btn">
                    Корзина
                    <span id="cart-count" class="cart-badge" style="display: none;">0</span>
                </button>
            </div>
        </div>
    </header>

    <main class="container">
        <section class="restaurant-title-section">
            <h1 class="title">Тануки</h1>
            <div class="rating">★ 4.5</div>
            <div class="meta-info">От 900 ₽ • Пицца и суши</div>
        </section>

        <section class="cards"></section>
    </main>

    <footer class="footer">
        <div class="container footer-block">
            <a href="home.html" class="logo">
                <img src="Картинки/logo.svg" alt="Логотип сервиса Delivery Food">
            </a>
            <nav class="footer-nav">
                <a href="#" class="footer-link">Ресторанам</a>
                <a href="#" class="footer-link">Курьерам</a>
                <a href="#" class="footer-link">Пресс-центр</a>
                <a href="#" class="footer-link">Контакты</a>
            </nav>
            <div class="social-links">
                <a href="#" class="social-link instagram">
                    <img src="Картинки/insta.png" alt="Instagram">
                </a>
                <a href="#" class="social-link facebook">
                    <img src="Картинки/facebook.png" alt="Facebook">
                </a>
                <a href="#" class="social-link vk">
                    <img src="Картинки/VK.png" alt="VK">
                </a>
            </div>
        </div>
    </footer>

    <div id="cart-modal" class="modal-overlay">
        <div class="modal-container">
            <div class="modal-header">
                <h2 class="modal-title">Корзина</h2>
                <button id="modal-close" class="modal-close-btn" type="button">&times;</button>
            </div>
            <div id="cart-items-list" class="modal-body"></div>
            <div class="modal-footer">
                <div class="total-price-tag"><span id="cart-total-price">0</span> ₽</div>
                <button class="btn-checkout" type="button">Оформить заказ</button>
            </div>
        </div>
    </div>
</body>
</html>
