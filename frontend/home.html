<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Сервис доставки Delivery Food</title>
    <link rel="stylesheet" href="home.css">
    <link rel="stylesheet" href="cart.css">
    <link rel="stylesheet" href="auth.css">
</head>
<body>
    <header class="page_header">
        <a href="home.html">
            <span class="logo">
                <img src="Картинки/logo.svg" alt="Логотип сервиса">
            </span>
        </a>
        <form class="delivery_address" action="#">
              <input type="text" placeholder="Адрес доставки" id="delivery-address">
        </form>
        <nav class="user_nav">
            <ul class="user_nav_list">
                <li class="user_nav_item login">
                    <button class="login_link auth-open" type="button">
                        <span>Войти</span>
                    </button>
                </li>
                <li class="user_nav_item cart">
                    <button class="login_link" type="button" id="cart-btn">
                        <span>Корзина</span>
                        <span id="cart-count" class="cart-badge" style="display: none;">0</span>
                    </button>
                </li>
            </ul>
        </nav>
    </header>
    <main class="home_main">
        <section class="main_header">
            <h1>Онлайн-сервис<br> доставки еды на дом</h1>
            <p>Блюда из любимого ресторана привезет<br> курьер в перчатках, маске и с антисептиком</p>
        </section>
        <section class="restouranse">
            <div class="restouranse_header">
                <h2>Рестораны</h2>
                <form class="restouranse_search" action="#">
                    <input type="search" placeholder="Поиск блюд и ресторанов">
                </form>
            </div>
            <ul class="restouranse_list"></ul>
        </section>

    </main>
    <footer class="page_footer">
        <a href="home.html">
            <span class="logo">
                <img src="Картинки/logo.svg" alt="Логотип сервиса">
            </span>
        </a>
        <ul class="info_list">
            <li>
                <a href="#">
                    <p>Ресторанам</p>
                </a>
            </li>
            <li>
                <a href="#">
                    <p>Курьерам</p>
                </a>
            </li>
            <li>
                <a href="#">
                    <p>Пресс-центр</p>
                </a>
            </li>
            <li>
                <a href="#">
                    <p>Контакты</p>
                </a>
            </li>
        </ul>
        <ul class="media_links">
            <li>
                <a href="#">
                    <img src="Картинки/insta.png">
                    <span class="visually_hidden">Мы в инстаграм</span>
                </a>
            </li>
            <li>
                <a href="#">
                    <img src="Картинки/facebook.png">
                    <span class="visually_hidden">Мы в фейсбук</span>
                </a>
            </li>
            <li>
                <a href="#">
                    <img src="Картинки/VK.png">
                    <span class="visually_hidden">Мы в ВК</span>
                </a>
            </li>
        </ul>
    </footer>

    <div id="cart-modal" class="modal-overlay">
        <div class="modal-container">
            <div class="modal-header">
                <h2 class="modal-title">Корзина</h2>
                <button id="modal-close" class="modal-close-btn" type="button">&times;</button>
            </div>
            <div id="cart-items-list" class="modal-body"></div>
            <div class="modal-footer">
                <div class="total-price-tag"><span id="cart-total-price">0</span> ₽</div>
                <button class="btn-checkout" type="button">Оформить заказ</button>
            </div>
        </div>
    </div>

    <script src="api.js" defer></script>
    <script src="auth.js" defer></script>
    <script src="cart.js" defer></script>
    <script src="home.js" defer></script>
</body>
</html>
